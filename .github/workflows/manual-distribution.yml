name: Build manual distribution

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: Publicar o actualizar los archivos generados en GitHub Release
        required: true
        default: true
        type: boolean
      release_type:
        description: Tipo de release a crear (draft, prerelease, published)
        required: true
        default: draft
        type: choice
        options:
          - draft
          - prerelease
          - published
      release_tag:
        description: Etiqueta de versión (ej. v3.6.5). Si se omite, se lee de pkg/version/version.go
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: manual-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  distribution:
    name: Verify and package Joss
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Joss
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-joss/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter/Dart SDK and prefetch deps
        shell: pwsh
        run: |
          flutter --version
          dart --version
          flutter config --no-analytics
          flutter doctor -v
          dart analyze sdk/dart/joss_plugin.dart

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Set up Kotlin compiler
        shell: pwsh
        run: |
          $version = '2.4.10'
          $archive = Join-Path $env:RUNNER_TEMP 'kotlin.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'kotlin'
          Invoke-WebRequest "https://github.com/JetBrains/kotlin/releases/download/v$version/kotlin-compiler-$version.zip" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          $bin = Join-Path $destination 'kotlinc/bin'
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $bin 'kotlinc.bat') -version

      - name: Build and package distribution
        shell: pwsh
        run: ./build_all.ps1

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: joss-distribution
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Resolve release tag and parameters
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        id: release_meta
        shell: pwsh
        run: |
          $tag = '${{ inputs.release_tag }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $versionSource = Get-Content 'pkg/version/version.go' -Raw
            if ($versionSource -match 'const Version = "([^"]+)"') {
              $ver = $Matches[1]
              if (-not $ver.StartsWith("v") -and -not $ver.StartsWith("V")) {
                $tag = "v$ver"
              } else {
                $tag = $ver
              }
            } else {
              throw 'No se pudo obtener la versión desde pkg/version/version.go'
            }
          }
          Write-Host "Etiqueta seleccionada para la release: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish or update GitHub Release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          RELEASE_TYPE: ${{ inputs.release_type || 'prerelease' }}
        run: |
          $files = Get-ChildItem -LiteralPath dist -File | Sort-Object Name | ForEach-Object FullName
          if (-not $files) {
            throw 'No se encontraron archivos en la carpeta dist.'
          }

          # Buscar si ya existe una release con este tag (draft, prerelease o published)
          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GH_REPO --json tagName,isDraft,isPrerelease 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            Write-Host "La release '$env:RELEASE_TAG' ya existe. Actualizando archivos y estado..."

            # Actualizar archivos con --clobber (reemplaza los existentes)
            gh release upload $env:RELEASE_TAG @files --repo $env:GH_REPO --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "No se pudieron actualizar los archivos de la release '$env:RELEASE_TAG'"
            }

            # Actualizar el tipo de release (draft/prerelease/published) segun el input
            $editFlags = @('release', 'edit', $env:RELEASE_TAG, '--repo', $env:GH_REPO)
            if ($env:RELEASE_TYPE -eq 'draft') {
              $editFlags += '--draft=true'
              $editFlags += '--prerelease=false'
            } elseif ($env:RELEASE_TYPE -eq 'prerelease') {
              $editFlags += '--draft=false'
              $editFlags += '--prerelease=true'
            } else {
              # published
              $editFlags += '--draft=false'
              $editFlags += '--prerelease=false'
            }
            gh @editFlags
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "No se pudo actualizar el estado de la release, pero los archivos si fueron actualizados."
            }

            Write-Host "✨ Release '$env:RELEASE_TAG' actualizada correctamente ($env:RELEASE_TYPE)."
          } else {
            Write-Host "Creando nueva release '$env:RELEASE_TAG' (tipo: $env:RELEASE_TYPE)..."
            $createFlags = @($env:RELEASE_TAG, '--repo', $env:GH_REPO, '--title', "Joss $env:RELEASE_TAG", '--generate-notes')
            if ($env:RELEASE_TYPE -eq 'draft') {
              $createFlags += '--draft'
            } elseif ($env:RELEASE_TYPE -eq 'prerelease') {
              $createFlags += '--prerelease'
            }
            # Adjuntar archivos al final
            $createFlags += $files
            gh release create @createFlags
            if ($LASTEXITCODE -ne 0) {
              throw "Error creando la release '$env:RELEASE_TAG'"
            }
            Write-Host "✨ Release '$env:RELEASE_TAG' creada exitosamente ($env:RELEASE_TYPE)."
          }
